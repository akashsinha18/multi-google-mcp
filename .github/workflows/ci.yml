name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e '.[dev]'
      - name: Test
        run: pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t multi-google-mcp:ci .
      - name: Smoke test
        run: |
          KEY=$(docker run --rm multi-google-mcp:ci python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')
          docker run -d --name mgm -p 8080:8080 \
            -e GOOGLE_CLIENT_ID=ci.apps.googleusercontent.com -e GOOGLE_CLIENT_SECRET=ci \
            -e BASE_URL=http://localhost:8080 -e TOKEN_ENC_KEY="$KEY" -e ALLOWED_EMAILS=ci@example.com \
            multi-google-mcp:ci
          for i in $(seq 1 30); do curl -sf localhost:8080/healthz && break; sleep 1; done
          curl -sf localhost:8080/healthz
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:8080/mcp \
            -H 'content-type: application/json' -H 'accept: application/json, text/event-stream' -d '{}')
          test "$code" = "401" || { echo "expected 401 from /mcp, got $code"; docker logs mgm; exit 1; }
